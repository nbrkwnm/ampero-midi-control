[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ampero-midi-control"
version = "0.1.0"
requires-python = "==3.14.7"
dependencies = [
    "mido>=1.3,<2"
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10"
]

[tool.pytest.ini_options]
testpaths = [
    "src/tests"
]
pythonpath = [
    "src"
]